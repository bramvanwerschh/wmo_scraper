[project]
name = "wmo-scraper"
version = "0.1.0"
description = "Scraper voor gemeentelijk WMO-beleid en -verordeningen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmo_scraper"]
